services:
  tiles:
    image: ghcr.io/corviont/tiles:0.7@sha256:9e382e90793edba0c01fbea63812714b109336b3b0ac252b2a20b3e199af7917
    working_dir: /data/maps
    command: [
      "serve", ".",
       "--public-url", "tiles", 
       "--port", "8080"]
    volumes:
      - "${CORVIONT_DATA_DIR:-./data}/tiles:/data/maps:ro"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080"]
      start_period: 5s
      start_interval: 1s
      interval: 60s
      timeout: 5s
      retries: 3

  router:
    image: ghcr.io/valhalla/valhalla:latest@sha256:f87ae7c6b33538e8d0248ab398ed469e1f814b0eee35c5efdcdef3541cb10cbb
    volumes:
      - "${CORVIONT_DATA_DIR:-./data}/valhalla:/data/valhalla:ro"
    command: [ "valhalla_service", "/data/valhalla/config.json", "2" ]
    expose:
      - "8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/status"]
      start_period: 5s
      start_interval: 1s
      interval: 60s
      timeout: 5s
      retries: 3

  geocoder:
    image: ghcr.io/corviont/geocoder:0.7@sha256:cadd4dcc9c4e4112cd5f3c2ea3902131294970ca278cafd3cd9e7dbdad88363f
    volumes:
      - "${CORVIONT_DATA_DIR:-./data}/geocoder/db.sqlite:/data/db.sqlite:ro"
    environment:
      - PORT=9090
      - DB_PATH=/data/db.sqlite
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$PORT/health"]
      start_period: 5s
      start_interval: 1s
      interval: 60s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/corviont/frontend:0.7@sha256:7d7f7f2af72451fc02f3485a399bd7266777ba940ea5c7b282f1fc4f412b507e
    environment:
    - CORVIONT_CORS_ALLOWED_ORIGINS=${CORVIONT_CORS_ALLOWED_ORIGINS:-}
    volumes:
      - "${CORVIONT_DATA_DIR:-./data}/dataset.json:/usr/share/nginx/html/dataset.json:ro"
      - "${CORVIONT_DATA_DIR:-./data}/map-style:/usr/share/nginx/html/map-style:ro"
    ports:
      - "${CORVIONT_PORT:?Environment variable CORVIONT_PORT is required}:8080"
    depends_on:
      tiles:
        condition: service_healthy
      router:
        condition: service_healthy
      geocoder:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/index.html"]
      start_period: 5s
      start_interval: 1s
      interval: 60s
      timeout: 5s
      retries: 3
